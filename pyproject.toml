[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bb84dsl"
version = "0.1.0"
description = "Educational BB84/QKD simulation DSL with lexer, parser, AST, and interpreter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishabh Chouhan" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bb84dsl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
